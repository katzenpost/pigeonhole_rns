name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y gcc
      - run: pip install -e .[test]
      - run: pytest
      - name: Two replicas and a client on a local Reticulum network
        run: python tests/e2e_two_replicas.py --run-dir "$RUNNER_TEMP/e2e"
      - name: The same at the 500 byte link MTU, 1000 byte boxes, multi-piece Channel frames
        run: python tests/e2e_two_replicas.py --run-dir "$RUNNER_TEMP/e2e500" --box-size 1000 --mtu-discovery no
      - name: Open mode, five replicas in a line, one late and one restarted
        run: python tests/e2e_replication.py --run-dir "$RUNNER_TEMP/repl" -n 5 --topo line

  # The Rust replica on Reticulum-rs, and Python and Rust replicas replicating together.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y gcc
      - run: pip install -e .[test]
      - run: cd rust && cargo clippy --release --all-targets -- -D warnings
      - run: cd rust && cargo test --release
      - run: cd rust && cargo build --release
      - run: cd rust && PYO3_PYTHON="$(which python)" cargo clippy --release --all-targets --features reticulum-py -- -D warnings
      - name: Open mode, Python replicas 0 and 2 and Rust replicas 1 and 3 in a mesh, Rust replica 1 restarted
        run: python tests/e2e_replication.py --run-dir "$RUNNER_TEMP/rmesh" -n 4 --topo mesh --rust 1,3
      - name: The same, five in a line, Rust replicas 1 and 3 between Python ones
        run: python tests/e2e_replication.py --run-dir "$RUNNER_TEMP/rline" -n 5 --topo line --rust 1,3

  # The bridge socket's wire format is shared with the Katzenpost replica: the
  # vectors here and in katzenpost's replica/testdata must be the same file.
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: katzenpost/katzenpost
          ref: reticulum-bridge
          path: katzenpost
      - run: cmp testdata/bridge_socket_vectors.json katzenpost/replica/testdata/bridge_socket_vectors.json

  # A mixnet client and a mesh client exchange boxes through the bridge, on a
  # docker mixnet whose replica1 has a bridge socket.
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      no_mixdecoy: true
      no_decoy: true
      epoch_duration: 2m
      no_metrics: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: katzenpost/katzenpost
          ref: reticulum-bridge
          path: katzenpost
      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.26"
          cache: false
      - name: Configure podman socket
        run: systemctl --user start podman.socket || true
      - name: Build and start the mixnet, with a bridge replica
        run: cd katzenpost/docker && make start wait
      - name: Mesh replica bridged to replica1, and the docker test
        run: tests/docker_bridge.sh test katzenpost/docker/mixnet-alpine
      - name: Logs
        if: failure()
        run: |
          tests/docker_bridge.sh logs katzenpost/docker/mixnet-alpine | tail -80 || true
          tail -40 katzenpost/docker/mixnet-alpine/reticulum/replica.log || true
      - name: Stop the mixnet
        if: always()
        run: |
          tests/docker_bridge.sh stop katzenpost/docker/mixnet-alpine || true
          cd katzenpost/docker && make stop || true
